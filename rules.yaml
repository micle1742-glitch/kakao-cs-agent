# 우선순위 헌법 설정 — 대회 당일 이 파일만 고쳐도 봇·kb 빌드·판정 도구가 따라온다.
# (다른 파일을 쓰려면 환경변수 RULES_FILE. 저장소의 쟁점 예시는 지어낸 것이고, 실제 대회 값은 data/의 사본에 둔다)

# 권위 순서: 위가 강하다. 카드끼리 값이 다르면 위쪽이 이기고, 진 쪽은 '인정하되 근거로 쓰지 않음'.
# id는 kb 빌드의 문서 분류(record·rule·old·promo·oral)와 카드 수정(decisions.yaml cards:)에서 쓴다.
authority:
  - {id: safety,  label: 안전·위기}
  - {id: legal,   label: 법·개인정보}
  - {id: protect, label: 고객 보호 원칙}
  - {id: record,  label: 시스템 원장·기록}
  - {id: rule,    label: 현행 규정}
  - {id: old,     label: 구판·인쇄물}
  - {id: promo,   label: 홍보물·발언·배너}
  - {id: oral,    label: 구두}
# 종류를 정하지 못한 문서는 이 단계와 같은 권위로 본다 (이름만 '확인 필요')
unknown_as: old

# 진 쪽 카드를 고객에게 말할 때의 틀. {loser_label}·{loser_value}·{winner_label}·{winner_value}를 채운다
acknowledge: "말씀하신 '{loser_value}'은(는) {loser_label}에 그렇게 나와 있던 것이 맞습니다. 다만 처리는 {winner_label} 기준인 '{winner_value}'로 합니다."

# 기준 시점: 판(시행일별 값)을 고를 때 어느 날짜로 보는가. 판정 도구 인자 이름과 같다
bases: [신고일, 주문일, 결제완료, 오늘]
default_basis: 오늘

# 쟁점별 기준 시점 (카드에 basis가 없을 때 쓴다). 쟁점마다 다르다 — 같은 날 개정이라도 판이 반대로 갈릴 수 있다
topics:
  반품 접수 기한: 신고일
  가격 인하 보상: 주문일
  할인 코드 기간: 결제완료

# 어떤 답에도 쓰지 않는 말 (헌법에 들어가고, 함정 테스트의 금지 문구로도 쓴다)
forbidden:
  - 확인 후 다시 안내드릴게요
  - 정책상 어렵습니다
  - 규정상 불가합니다
  - 고객님 잘못입니다

# 위기 신호 사전 분류 — 코드가 LLM보다 먼저 본다. 정규식, 하나라도 맞으면 그 분류
crisis:
  # 자·타해를 직접 말하는 표현
  signals: ["죽고 ?싶", "죽어 ?버리", "자살", "극단적 ?선택", "살기 ?싫", "사라지고 ?싶", "끝내고 ?싶", "목숨을", "유서", "뛰어내리", "더는 못 버티", "다 내려놓고 ?싶"]
  # 이별 인사처럼 애매한 표현 — 애매하면 위기로 본다(fail-closed)
  ambiguous: ["마지막으로 .{0,10}(먹어|맛보|주문|받아)", "이제 (주문|살)(할)? 일(은|도|이)? 없", "그동안 (고마웠|감사했)", "이번이 마지막 주문", "더 (살|버틸) 이유"]
  # 몸 이상 문의 — 위기가 아니다 (위기 표현이 같이 있으면 위기가 이긴다)
  health: ["배탈", "복통", "설사", "구토", "토했", "두드러기", "알레르기", "식중독", "응급실", "병원", "열이 나"]
  empathy: 그런 마음이 드실 만큼 많이 힘드셨겠습니다.
  resource: 혼자 감당하지 않으셔도 됩니다. 24시간 자살예방 상담전화 109에서 언제든 이야기를 들어 드립니다.
  order: 주문하신 건은 제가 책임지고 처리해 두겠습니다.
  # 위기 이관 (대회 때는 실제 대상·우선순위 코드로 바꾼다)
  escalation: {target: SAFETY, priority: 높음}

# 피싱·사칭: 고객이 결제·송금을 하려는 중이면 답에 멈추라는 말이 반드시 있어야 한다
phishing:
  detect: ["(문자|링크|메시지|URL|카톡).{0,20}(결제|송금|이체|입금)", "(결제|송금|이체|입금).{0,12}(하라|해 ?달라|요구|중이|하려)", "사칭", "피싱", "가짜 (사이트|문자)"]
  stop_ok: ["멈추", "멈춰", "중단", "하지 마", "진행하지", "보내지 마"]
  stop_sentence: 진행 중인 결제나 송금은 바로 멈춰 주세요.
