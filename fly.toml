# Fly.io 설정 — 항상 켜진 워커 1대. app 이름은 `fly launch --no-deploy` 때 정한 값으로 바꾼다.
# 순서와 비밀값은 DEPLOY.md
app = "kakao-cs-bot"
primary_region = "nrt"          # 도쿄. 카카오 게이트웨이·Gemini와 가까운 곳으로 고른다
kill_timeout = 30               # 멈출 때 처리 중인 답장을 마칠 시간

[build]
  dockerfile = "Dockerfile"

# 비밀이 아닌 설정만. 토큰·키는 `fly secrets set`으로 (DEPLOY.md)
[env]
  ENABLE_TOOLS = "true"
  HEALTH_PORT = "8080"
  WATCHDOG_SECONDS = "600"      # 게이트웨이가 10분 넘게 끊기면 프로세스를 끝내 다시 띄움
  # RULES_FILE = "/data/rules.yaml"   # 대회용 규칙 사본을 볼륨에 올린 뒤 켠다

# 웹 서비스가 아니므로 [http_service]를 두지 않는다.
# → 들어오는 요청이 없어도 자동으로 멈추지 않는다 (auto_stop은 http_service에만 걸린다)

# 대화 기록 DB·로그·대회 자료(knowledge, kb 카드)
[mounts]
  source = "bot_data"
  destination = "/data"

# 프로세스가 죽거나 감시가 끝내면 다시 띄운다
[[restart]]
  policy = "always"
  retries = 10

# 상태 확인: 머신 안에서 /health를 본다 (밖으로 열지 않음). `fly checks list`로 확인
[checks]
  [checks.alive]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
