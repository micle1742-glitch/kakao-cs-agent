# 지어낸 예시입니다 (가상 고객·주문). 대회 실제 내용 없음.
id: DEMO-18
title: 금지 문구와 근거 없는 금액은 사후 검사기가 뺌 (LLM 다시 안 부름)
tags: [사후검사]
case: {received_at: "2037-06-30(화) 10:00", account: "회원 로그인 · 석예시 · 010-0000-0018"}
api_fixtures:
  API_03: {"900000018": {item: 사과 5kg, paid: 30000}}
turns:
  - customer: 주문 900000018 사과가 몇 개 멍들었어요. 얼마 돌려받을 수 있어요?
llm_script:
  - call: [{name: API_03, args: {order_id: "900000018"}}]
  - text: 정책상 어렵습니다. 결제하신 30,000원 중 환불액은 12,500원입니다. 멍든 개수를 알려 주시면 다시 계산해 드릴게요.
expect:
  not_contains: [정책상 어렵습니다, "12,500원"]
  contains: [멍든 개수를 알려 주시면]
