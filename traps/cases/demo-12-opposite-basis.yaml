# 지어낸 예시입니다 (가상 고객·카드). 대회 실제 내용 없음.
id: DEMO-12
title: 판이 반대로 갈림 — 반품 기한은 신고일(→ 개정판), 가격 보상은 주문일(→ 구판)
tags: [헌법, 판정]
kb: traps/fixtures/kb
case: {received_at: "2037-06-30(화) 10:00", account: "회원 로그인 · 남예시 · 010-0000-0012"}
turns:
  - customer: 6월 10일에 주문한 상자를 25일에 받았는데 물렀어요. 그 사이 값도 내렸던데 반품이랑 차액 보상 둘 다 돼요?
llm_script:
  - call:
      - {name: judge_rule, args: {topic: 반품 접수 기한, 주문일: "2037-06-10", 신고일: "2037-06-30"}}
      - {name: judge_rule, args: {topic: 가격 인하 보상, 주문일: "2037-06-10", 신고일: "2037-06-30"}}
  - text: 두 건 모두 확인했습니다. 반품은 접수되고, 차액은 주문하신 날 기준 규정대로 돌려드립니다.
expect:
  tool_result:
    # 반품 기한: 신고일(06-30)엔 06-20 개정판이 시행 중 → 5일 (주문일로 봤다면 3일이 됐을 것)
    # 가격 보상: 주문일(06-10)엔 06-15 개정 전 → 구판 (신고일로 봤다면 10일 이내 쿠폰이 됐을 것)
    - tool: judge_rule
      contains: ['"value": "5일"', '"value": "기간 제한 없이 차액 환불"']
      not_contains: ['"value": "3일"', '"value": "10일 이내 쿠폰"']
