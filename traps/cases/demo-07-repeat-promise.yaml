# 지어낸 예시입니다 (가상 고객·주문). 대회 실제 내용 없음.
id: DEMO-07
title: 이미 이관한 케이스에서 다시 "전달하겠습니다" — 새 이관 없이 기존 접수번호 안내
tags: [이관, 중복]
case: {received_at: "2037-06-30(화) 10:00", account: "회원 로그인 · 윤예시 · 010-0000-0007"}
turns:
  - customer: 상품 설명이랑 실제가 달라요. 담당자 확인 부탁해요
  - customer: 꼭 좀 전해 주세요
    expect:
      contains: [HO-20370630-001]
llm_script:
  - call: [{name: API_35, args: {lane: HANDOFF, target: GENERAL, priority: 보통, reason: "[GENERAL·보통] 상품 설명과 실물 차이"}}]
  - text: 담당자에게 넘겨 두었습니다. 접수번호는 {last_receipt}이고 7월 3일(금)까지 회신드립니다.
  - text: 네, 담당자에게 다시 전달하겠습니다.
expect:
  api_max: {API_35: 1}
